services:
  database:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_ROOT_HOST: "%"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 5
      start_period: 60s
    ports:
      - "127.0.0.1:${DB_PORT}:3306"
    volumes:
      - database_data:/var/lib/mysql:rw
    networks:
      - forklore_network

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8080:80"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - forklore_network

volumes:
  database_data:

networks:
  forklore_network:
    external: true
    name: ${DB_NETWORK}
